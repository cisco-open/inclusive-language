name: Language Check
on: [pull_request]

permissions:
  contents: read

jobs:
  language-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for exclusionary language
        uses: Open-Paws/no-animal-violence-action@main
